[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-documentaries"
version = "0.1.0"
description = "A Telegram bot that turns a portrait photo into a narrated wildlife documentary."
readme = "README.md"
requires-python = ">=3.11"
# Direct dependencies are pinned exactly so the environment is reproducible
# from this file (SPECS/TECH.md, "Repo hygiene"). Transitives resolve normally.
dependencies = [
    "google-adk==2.11.0",
    "python-telegram-bot==22.8",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    # MP3 encoding for the Narrator (Phase 6, D3): a 248 KB self-contained
    # wheel with liblame bundled, so the encoder is reproducible from this
    # file rather than depending on a system ffmpeg that is not installed.
    "lameenc==1.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Non-default rule selection: extend the default (E4, E7, E9, F) with the
# correctness and readability rules this codebase is held to.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # flake8-bandit
    "PTH",  # flake8-use-pathlib
    "T20",  # flake8-print
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately print nothing, but they do call asserts on private
# behaviour and construct doubles with broad types.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true